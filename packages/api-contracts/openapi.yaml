openapi: 3.1.0
info:
  title: Paw Time Platform API
  version: 0.1.0
  description: ワーカーアプリと採用企業アプリを接続する共通API。
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
  /v1/worker/jobs:
    get:
      operationId: listPublishedJobs
      responses:
        "200":
          description: 公開中の求人
  /v1/worker/applications:
    post:
      operationId: applyForJob
      responses:
        "201":
          description: 応募を作成
  /v1/worker/shifts:
    get:
      operationId: listWorkerShifts
      responses:
        "200":
          description: ワーカーの確定シフト
  /v1/worker/letters:
    get:
      operationId: listWorkerLetters
      responses:
        "200":
          description: ワーカーに届いた手紙
  /v1/business/stores:
    get:
      operationId: listOrganizationStores
      responses:
        "200":
          description: 企業の店舗一覧
  /v1/business/jobs:
    get:
      operationId: listOrganizationJobs
      responses:
        "200":
          description: 企業の求人一覧
    post:
      operationId: createJob
      responses:
        "201":
          description: 求人を作成（下書きまたは公開）
        "400":
          description: 店舗が見つからない、または終了時刻が開始時刻より前
        "409":
          description: 作成時に終了状態は指定できない
  /v1/business/jobs/{jobId}/publish:
    post:
      operationId: publishJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 下書きの求人を公開
        "409":
          description: 下書き以外は公開できない
  /v1/business/jobs/{jobId}/close:
    post:
      operationId: closeJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 公開中の求人を終了
        "409":
          description: 公開中以外は終了できない
  /v1/business/applications:
    get:
      operationId: listOrganizationApplications
      responses:
        "200":
          description: 企業への応募一覧
  /v1/business/shifts:
    get:
      operationId: listOrganizationShifts
      responses:
        "200":
          description: 企業の確定シフト
  /v1/business/applications/{applicationId}/decision:
    post:
      operationId: decideApplication
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 採用または不採用を記録
        "409":
          description: 選考済み、求人が公開中でない、または定員に達している
  /v1/business/shifts/{shiftId}/attendance:
    post:
      operationId: recordAttendance
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: 追記型の打刻を記録（出勤・退勤・休憩開始・休憩終了）
        "400":
          description: 退勤時刻が出勤時刻より前
        "409":
          description: シフトの状態と合わない
  /v1/business/shifts/{shiftId}/attendance/corrections:
    post:
      operationId: correctAttendance
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: 理由つきで打刻時刻を修正する。元の打刻は残る
        "400":
          description: 前後の打刻と順序が合わない
  /v1/business/workers:
    get:
      operationId: listWorkerHistories
      responses:
        "200":
          description: 応募または勤務したワーカーごとの、この企業での勤務履歴
  /v1/business/shifts/{shiftId}/confirm:
    post:
      operationId: confirmShift
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 退勤済みのシフトの勤怠を確定
        "409":
          description: 退勤済み以外は確定できない
  /v1/business/shifts/{shiftId}/no-show:
    post:
      operationId: markShiftNoShow
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 開始時刻を過ぎても出勤のないシフトを欠勤にする
        "409":
          description: 勤務前でない、または開始時刻前
  /v1/business/shifts/{shiftId}/attendance-summary:
    get:
      operationId: getAttendanceSummary
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 予定時刻と実績から算出した遅刻・出退勤情報
  /v1/business/attendance-summaries:
    get:
      operationId: listAttendanceSummaries
      responses:
        "200":
          description: 企業のすべてのシフトの勤怠サマリー
  /v1/business/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: 操作者、組織のメンバー一覧、店舗一覧
  /v1/business/stores/{storeId}:
    put:
      operationId: updateStore
      responses:
        "200":
          description: 島の見た目（ロゴ・看板の色・ひとこと）を更新（店長のみ）
  /v1/business/stores/{storeId}/settings:
    get:
      operationId: getStoreSettings
      responses:
        "200":
          description: 店ごとの休憩ルール・割増率・丸め単位・締め日
    put:
      operationId: updateStoreSettings
      responses:
        "200":
          description: 設定を更新（店長のみ）
  /v1/business/shifts/{shiftId}/urgent-job:
    post:
      operationId: createUrgentJob
      responses:
        "201":
          description: 欠勤・キャンセルの枠を【急募】として公開（店長のみ）
  /v1/business/invitations:
    get:
      operationId: listInvitations
      responses:
        "200":
          description: 声をかけた記録
    post:
      operationId: createInvitation
      responses:
        "201":
          description: 過去に働いた人に声をかける（店長のみ）
  /v1/business/closed-periods:
    get:
      operationId: listClosedPeriods
      responses:
        "200":
          description: 締めた月
    post:
      operationId: closePeriod
      responses:
        "201":
          description: 月を締める（店長のみ）
  /v1/business/closed-periods/{periodId}:
    delete:
      operationId: reopenPeriod
      responses:
        "200":
          description: 締めを解除（店長のみ）
  /v1/business/shop-feedback/summary:
    get:
      operationId: shopFeedbackSummary
      responses:
        "200":
          description: ワーカーの評価のタグ票数と、票数で育つ島の目印。5人以上そろった店だけ
  /v1/business/insights:
    get:
      operationId: insights
      responses:
        "200":
          description: 働いたあとの信号と求人ごとのKPI（店長のみ）
  /v1/business/audit-logs:
    get:
      operationId: listAuditLogs
      responses:
        "200":
          description: 監査ログ（店長のみ）
  /v1/worker/shifts/{shiftId}/attendance:
    post:
      operationId: recordOwnAttendance
      responses:
        "201":
          description: ワーカー本人の打刻
  /v1/worker/applications/{applicationId}/withdraw:
    post:
      operationId: withdrawApplication
      responses:
        "200":
          description: 辞退。作成済みのシフトはキャンセルになる
  /v1/worker/invitations:
    get:
      operationId: listWorkerInvitations
      responses:
        "200":
          description: 届いた声かけ
  /v1/worker/invitations/{invitationId}/respond:
    post:
      operationId: respondToInvitation
      responses:
        "200":
          description: 受ける（そのまま採用）か断る
  /v1/worker/letters/{letterId}/reply:
    post:
      operationId: replyToLetter
      responses:
        "200":
          description: 手紙にスタンプで返事
  /v1/worker/shop-feedback:
    post:
      operationId: createShopFeedback
      responses:
        "201":
          description: お店への匿名の答え
  /v1/worker/activity:
    post:
      operationId: recordWorkerActivity
      responses:
        "201":
          description: アプリを開いた、島を訪ねた
  /v1/business/attendance-events:
    get:
      operationId: listAttendanceEvents
      responses:
        "200":
          description: 企業のすべての打刻（修正前の記録も含む）を古い順に
  /v1/business/evaluations:
    get:
      operationId: listEvaluations
      responses:
        "200":
          description: 企業が登録した評価の一覧
    post:
      operationId: createEvaluation
      responses:
        "201":
          description: 勤怠確定済みのシフトについてワーカーの評価を登録
        "409":
          description: 勤怠が確定していない
  /v1/business/letters:
    get:
      operationId: listLetters
      responses:
        "200":
          description: 企業が送った手紙の一覧
    post:
      operationId: sendLetter
      responses:
        "201":
          description: 勤務を終えたワーカーに手紙を送る（定型文または自由文）
        "400":
          description: 自由文が空
        "409":
          description: シフトがまだ終わっていない
  /v1/business/world:
    get:
      operationId: getEmployerWorld
      responses:
        "200":
          description: 企業の家と所持品を取得
  /v1/business/world/rewards:
    get:
      operationId: listEmployerRewards
      responses:
        "200":
          description: 企業の家への最近の報酬付与履歴
  /v1/telemetry/events:
    post:
      operationId: postTelemetryEvents
      description: >-
        ゲームからの仮名イベントをバッチで受け取る。install_id はゲームが生成するUUIDでアカウントとは紐付かない。
        イベント種別とpropsは許可リスト（packages/api-contracts/src/telemetry.ts）で検証し、未知の種別・props・自由記述は拒否する。
        1バッチ最大50件・16KB、install_id ごとに毎分12バッチまで。text/plain（sendBeacon）も受け付ける。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
      responses:
        "200":
          description: 受理件数と、拒否したイベントの位置・理由
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected]
                properties:
                  accepted: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        i: { type: integer }
                        reason: { type: string }
        "400":
          description: バッチの形式が不正
        "413":
          description: バッチが大きすぎる
        "429":
          description: レート制限
    delete:
      operationId: deleteTelemetryInstall
      description: 本人の依頼による削除。install_id の全イベントを消す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [install_id]
              properties:
                install_id: { type: string, format: uuid }
      responses:
        "200":
          description: 削除件数
  /v1/insights/metrics:
    get:
      operationId: getInsightsMetrics
      description: >-
        集計値のみ。5インストール未満のセルは null（非表示）。mode=simulated は乱数シード付きの合成データで、
        レスポンスの synthetic が true になる。
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [live, simulated], default: live }
        - name: demo
          in: query
          description: 1 のとき demo_session のイベントだけを集計
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: InsightsMetricsResponseSchema（packages/api-contracts）
  /v1/insights/feed:
    get:
      operationId: getInsightsFeed
      description: 直近30分の匿名アクティビティ。install_id は返さない。
      parameters:
        - name: demo
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: InsightsFeedResponseSchema（packages/api-contracts）
components:
  schemas:
    TelemetryBatch:
      type: object
      additionalProperties: false
      required: [install_id, events]
      properties:
        install_id: { type: string, format: uuid }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/TelemetryEvent"
    TelemetryEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        t: { type: number, description: unix秒。サーバー時刻から大きくずれる値はサーバー時刻に置き換える }
        type:
          type: string
          enum: [app_open, job_cards_shown, job_card_open, job_accept, job_pass, shift_start, shift_end, cat_tired_stop,
            review_submitted, practice_done, skill_badge_share_toggled, shop_island_visit, scoop_night, hatch,
            island_expand, island_share, outfit_change, calendar_add, suggestions_toggled, chat_open, chat_signal,
            anon_issue_sent, faq_auto_answered, shop_message_sent]
          description: >-
            chat_signal は固定タグのみ（生の会話文は端末から出さない）で、private_mode:false が必須。
            anon_issue_sent は本人がお店への匿名伝達に同意したときだけ送る。
        props:
          type: object
          description: 種別ごとの許可props（enum・整数範囲・真偽値のみ）。全種別で demo_session:boolean を許可。
